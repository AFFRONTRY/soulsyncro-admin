<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>SoulSyncro — tableau de bord</title>

<!--
  ---------------------------------------------------------------------------
  Le tableau de bord d'exploitation.
  ---------------------------------------------------------------------------

  Page unique, sans étape de compilation, servie telle quelle par GitHub Pages.

  ⚠️ CETTE PAGE EST PUBLIQUE, LES DONNÉES NE LE SONT PAS.

  L'adresse se trouve, et c'est sans conséquence : la page seule n'affiche
  qu'un formulaire. Toute l'autorité vient de la session — les quatre
  fonctions de 0073 lèvent `insufficient_privilege` pour quiconque n'a pas
  `profiles.is_admin`, y compris un compte connecté ordinaire.

  Ce n'est donc jamais le secret de l'URL qui protège. Se croire protégé par
  une adresse difficile à deviner est la façon ordinaire de se faire
  surprendre.

  ---------------------------------------------------------------------------
  La clé écrite plus bas n'est pas un secret
  ---------------------------------------------------------------------------

  `sb_publishable_…` est la clé publiable, déjà compilée dans l'APK et donc
  lisible par quiconque ouvre le fichier d'installation. Sa sécurité repose
  entièrement sur RLS. Aucune clé de service ne doit JAMAIS figurer ici : elle
  passerait outre toutes les règles, et cette page est publique.

  ---------------------------------------------------------------------------
  Pourquoi `supabase-js` est versionné à côté
  ---------------------------------------------------------------------------

  Un outil d'exploitation ne doit pas cesser de fonctionner parce qu'un CDN
  change d'avis, et sa version ne doit pas dériver sans qu'on l'ait décidé.
  C'est la même raison qui interdit `fonts.googleapis.com` dans l'application.
-->

<style>
  :root {
    --fond: #FDF7F0;
    --carte: #FFFFFF;
    --trait: #E8DDD2;
    --texte: #2B1D14;
    --doux: #7A6558;
    --primaire: #B7410E;
    --alerte: #C0392B;
    --calme: #1E8449;
    --attente: #B7791F;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --fond: #17110D;
      --carte: #221913;
      --trait: #3A2C22;
      --texte: #F5EBE2;
      --doux: #B09C8E;
      --primaire: #E8724A;
      --alerte: #E8705F;
      --calme: #5FBF86;
      --attente: #E0A94A;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 16px;
    background: var(--fond);
    color: var(--texte);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 12px; margin-bottom: 20px; }
  h1 { font-size: 20px; margin: 0; font-weight: 700; }
  h2 { font-size: 14px; margin: 0 0 14px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--doux); }

  .grandit { flex: 1; }
  .discret { color: var(--doux); font-size: 13px; }

  button {
    font: inherit; font-weight: 600; cursor: pointer;
    padding: 10px 18px; min-height: 44px;
    border: none; border-radius: 10px;
    background: var(--primaire); color: #FFFFFF;
  }
  button:disabled { opacity: .5; cursor: default; }

  input {
    font: inherit; width: 100%; padding: 12px 14px; min-height: 44px;
    border: 1px solid var(--trait); border-radius: 10px;
    background: var(--carte); color: var(--texte);
  }

  .carte {
    background: var(--carte);
    border: 1px solid var(--trait);
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 16px;
  }

  /* Les compteurs : une grille qui se replie toute seule sur 720 pixels. */
  .chiffres { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
  .chiffre .valeur { font-size: 26px; font-weight: 700; line-height: 1.15; }
  .chiffre .nom { font-size: 12px; color: var(--doux); }

  .alerte { color: var(--alerte); }
  .calme  { color: var(--calme); }
  .attente { color: var(--attente); }

  /* Le bloc qui décide : plein cadre, et le chiffre qui compte en très gros. */
  .promesse { display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px; margin-bottom: 18px; }
  .promesse .age { font-size: 40px; font-weight: 800; line-height: 1; }

  .note {
    border-left: 3px solid var(--attente);
    padding: 10px 14px; margin-top: 14px;
    color: var(--doux); font-size: 14px;
  }

  /* Un tableau large défile dans son cadre, jamais la page. */
  .cadre { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--trait); white-space: nowrap; }
  th { color: var(--doux); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }

  #connexion { max-width: 380px; margin: 60px auto; }
  #connexion p { color: var(--doux); font-size: 14px; }
  #connexion input { margin-bottom: 12px; }
  #connexion button { width: 100%; }
  #erreur { color: var(--alerte); font-size: 14px; min-height: 20px; }
</style>
</head>
<body>

<section id="connexion" class="carte">
  <h1>SoulSyncro</h1>
  <p>Tableau de bord d'exploitation. Réservé aux comptes de modération.</p>
  <form id="formulaire">
    <input id="adresse" type="email" autocomplete="username" placeholder="Adresse e-mail" required>
    <input id="motdepasse" type="password" autocomplete="current-password" placeholder="Mot de passe" required>
    <button type="submit" id="entrer">Entrer</button>
  </form>
  <p id="erreur"></p>
</section>

<main id="bord" hidden>
  <header>
    <h1 class="grandit">SoulSyncro</h1>
    <span class="discret" id="horodatage"></span>
    <button id="actualiser">Actualiser</button>
    <button id="sortir" style="background:transparent;color:var(--doux)">Sortir</button>
  </header>
  <div id="contenu"></div>
</main>

<script src="./vendor/supabase-2.112.2.js"></script>
<script>
(function () {
  'use strict';

  var URL_PROJET = 'https://pezfgziqkqhoyazlrxrd.supabase.co';
  var CLE_PUBLIABLE = 'sb_publishable_39J3VhPk3bhiDKkkzEVisw_G_Nu_IA1';

  var sb = supabase.createClient(URL_PROJET, CLE_PUBLIABLE);

  var $ = function (id) { return document.getElementById(id); };

  function nombre(n) {
    if (n === null || n === undefined) return '—';
    return Number(n).toLocaleString('fr-FR');
  }

  function echapper(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  function chiffre(nom, valeur, classe) {
    return '<div class="chiffre"><div class="valeur ' + (classe || '') + '">' +
      echapper(valeur) + '</div><div class="nom">' + echapper(nom) + '</div></div>';
  }

  /*
    Le bloc qui décide d'une action aujourd'hui.

    ⚠️ Il vire au rouge à 24 h, pas à 48. La promesse publique est de 48 heures,
    mais Google Play en attend 24 : c'est la plus stricte qui décide d'une
    suspension sur la boutique, donc c'est elle qu'on tient.
  */
  function blocSante(s) {
    var age = s.plus_vieux_signalement_h;
    var classe = age === null ? 'calme' : age >= 24 ? 'alerte' : age >= 12 ? 'attente' : 'calme';
    var phrase = age === null
      ? 'Aucun signalement en attente.'
      : 'Le plus vieux signalement attend depuis ' + age + ' heures.';

    var html = '<section class="carte"><h2>Ce qui appelle une action</h2>' +
      '<div class="promesse"><span class="age ' + classe + '">' +
      (age === null ? '—' : age + ' h') + '</span>' +
      '<span class="discret">' + echapper(phrase) +
      ' Promesse publique : 48 h. Attente de Google Play : 24 h.</span></div>' +
      '<div class="chiffres">' +
      chiffre('signalements en attente', nombre(s.signalements_en_attente),
        s.signalements_en_attente > 0 ? 'attente' : 'calme') +
      chiffre('au-delà de 24 h', nombre(s.signalements_plus_24h),
        s.signalements_plus_24h > 0 ? 'alerte' : 'calme') +
      chiffre('au-delà de 48 h', nombre(s.signalements_plus_48h),
        s.signalements_plus_48h > 0 ? 'alerte' : 'calme') +
      chiffre('images à juger', nombre(s.images_en_attente)) +
      chiffre('demandes de badge', nombre(s.badges_en_attente)) +
      chiffre('profils suspects', nombre(s.profils_suspects)) +
      chiffre('notifications en attente', nombre(s.push_en_attente)) +
      chiffre('notifications en échec', nombre(s.push_en_echec),
        s.push_en_echec > 0 ? 'alerte' : '') +
      chiffre('fichiers à effacer', nombre(s.fichiers_restants)) +
      chiffre('fichiers retenus', nombre(s.fichiers_retenus)) +
      chiffre('plantages non traités', nombre(s.plantages_non_traites),
        s.plantages_non_traites > 0 ? 'attente' : 'calme') +
      chiffre('occurrences du pire', nombre(s.plantage_max_occurrences)) +
      '</div>';

    if (s.fichiers_retenus > 0) {
      html += '<p class="note">Les fichiers <em>retenus</em> ne sont pas en retard : ' +
        'une ligne les cite encore — souvent la pièce d\'un dossier de modération. ' +
        'Le ménage les laisse volontairement en place.</p>';
    }

    return html + '</section>';
  }

  function blocUsage(u) {
    var abandon = u.inscrits - u.profils_termines;
    return '<section class="carte"><h2>Ce que devient l\'application</h2><div class="chiffres">' +
      chiffre('inscrits', nombre(u.inscrits)) +
      chiffre('profils terminés', nombre(u.profils_termines)) +
      chiffre('inscriptions non terminées', nombre(abandon), abandon > 0 ? 'attente' : 'calme') +
      chiffre("aujourd'hui", nombre(u.inscrits_jour)) +
      chiffre('sur 7 jours', nombre(u.inscrits_7j)) +
      chiffre('sur 30 jours', nombre(u.inscrits_30j)) +
      chiffre('actifs 7 jours', nombre(u.actifs_7j)) +
      chiffre('actifs 30 jours', nombre(u.actifs_30j)) +
      chiffre('matchs', nombre(u.matchs)) +
      chiffre('matchs sur 7 jours', nombre(u.matchs_7j)) +
      chiffre('messages', nombre(u.messages)) +
      chiffre('messages sur 7 jours', nombre(u.messages_7j)) +
      chiffre('publications', nombre(u.publications)) +
      chiffre('statuts visibles', nombre(u.statuts_visibles)) +
      chiffre('bannis', nombre(u.bannis)) +
      chiffre('comptes supprimés', nombre(u.comptes_supprimes)) +
      '</div>' +
      '<p class="note">L\'écart entre inscrits et profils terminés est l\'abandon ' +
      'en cours d\'inscription. C\'est le chiffre à surveiller après toute retouche ' +
      'du parcours — la photo obligatoire en est l\'étape la plus exposée.</p>' +
      '</section>';
  }

  function blocDensite(lignes) {
    var corps = lignes.map(function (l) {
      return '<tr><td>' + echapper(l.ville) + '</td><td>' + echapper(l.commune) + '</td>' +
        '<td class="n">' + nombre(l.inscrits) + '</td>' +
        '<td class="n">' + nombre(l.termines) + '</td>' +
        '<td class="n">' + nombre(l.actifs_30j) + '</td></tr>';
    }).join('');

    return '<section class="carte"><h2>Où la densité permet d\'ouvrir</h2>' +
      '<div class="cadre"><table><thead><tr>' +
      '<th>Ville</th><th>Commune</th><th class="n">Inscrits</th>' +
      '<th class="n">Terminés</th><th class="n">Actifs 30 j</th>' +
      '</tr></thead><tbody>' + (corps || '<tr><td colspan="5">Personne encore.</td></tr>') +
      '</tbody></table></div>' +
      '<p class="note">Ce sont les <strong>profils terminés</strong> qui font la densité, ' +
      'pas les inscrits : un compte sans photo ni test n\'apparaît dans la découverte ' +
      'de personne. Ouvrir une ville sur le nombre d\'inscrits ferait remplir de la ' +
      'publicité vers un fil vide.</p></section>';
  }

  function blocArgent(a) {
    var html = '<section class="carte"><h2>Les paliers</h2><div class="chiffres">' +
      chiffre('abonnés VIP', nombre(a.abonnes_vip)) +
      chiffre('abonnés Premium', nombre(a.abonnes_premium)) +
      chiffre('veulent le VIP', nombre(a.interets_vip)) +
      chiffre('veulent le Premium', nombre(a.interets_premium)) +
      chiffre('paiements réussis ce mois', nombre(a.paiements_reussis_mois)) +
      chiffre('recettes du mois (FCFA)', nombre(a.recettes_mois_fcfa)) +
      chiffre('paiements échoués', nombre(a.paiements_echoues_mois),
        a.paiements_echoues_mois > 0 ? 'alerte' : '') +
      chiffre('paiements en attente', nombre(a.paiements_en_attente)) +
      '</div>';

    /*
      ⚠️ Dire pourquoi c'est à zéro, au lieu d'afficher un zéro muet.

      « 0 FCFA » se lit « personne ne paie ». La vérité est « on n'encaisse pas
      encore » — deux situations opposées, dont la seconde n'appelle aucune
      inquiétude.
    */
    if (!a.encaissement_ouvert) {
      html += '<p class="note"><strong>L\'encaissement n\'est pas ouvert.</strong> ' +
        'Aucun agrégateur mobile money n\'est branché : les clés manquent dans les ' +
        'secrets Supabase, et le paiement se déclare indisponible plutôt que de ' +
        'laisser passer. Ces zéros ne disent donc rien du produit. ' +
        'Les deux chiffres qui parlent aujourd\'hui sont les <em>intentions</em>, ' +
        'recueillies avant qu\'un encaissement existe.</p>';
    }

    return html + '</section>';
  }

  function montrer(section, message) {
    $('contenu').innerHTML = '<section class="carte"><h2>' + echapper(section) +
      '</h2><p class="alerte">' + echapper(message) + '</p></section>';
  }

  async function charger() {
    $('actualiser').disabled = true;
    $('actualiser').textContent = 'Chargement…';

    try {
      var r = await Promise.all([
        sb.rpc('tableau_sante'),
        sb.rpc('tableau_usage'),
        sb.rpc('tableau_densite'),
        sb.rpc('tableau_argent'),
      ]);

      var enPanne = r.find(function (x) { return x.error; });
      if (enPanne) {
        /*
          42501 : le compte est connecté mais n'est pas modérateur. Le dire
          franchement — un tableau vide se lit comme une panne, et l'on
          chercherait le défaut du mauvais côté.
        */
        if (enPanne.error.code === '42501') {
          montrer('Accès refusé',
            "Ce compte n'est pas modérateur. Il faut is_admin sur le profil.");
        } else {
          montrer('Lecture impossible', enPanne.error.message);
        }
        return;
      }

      $('contenu').innerHTML =
        blocSante(r[0].data[0]) +
        blocUsage(r[1].data[0]) +
        blocDensite(r[2].data) +
        blocArgent(r[3].data[0]);

      $('horodatage').textContent = 'à ' + new Date().toLocaleTimeString('fr-FR');
    } catch (cause) {
      montrer('Réseau', String(cause));
    } finally {
      $('actualiser').disabled = false;
      $('actualiser').textContent = 'Actualiser';
    }
  }

  function afficherLeBord(oui) {
    $('connexion').hidden = oui;
    $('bord').hidden = !oui;
  }

  $('formulaire').addEventListener('submit', async function (e) {
    e.preventDefault();
    $('erreur').textContent = '';
    $('entrer').disabled = true;

    var r = await sb.auth.signInWithPassword({
      email: $('adresse').value.trim(),
      password: $('motdepasse').value,
    });

    $('entrer').disabled = false;

    if (r.error) {
      $('erreur').textContent = r.error.message === 'Invalid login credentials'
        ? 'Adresse ou mot de passe incorrect.'
        : r.error.message;
      return;
    }

    $('motdepasse').value = '';
    afficherLeBord(true);
    charger();
  });

  $('actualiser').addEventListener('click', charger);

  $('sortir').addEventListener('click', async function () {
    await sb.auth.signOut();
    afficherLeBord(false);
    $('contenu').innerHTML = '';
  });

  /*
    La session survit à la fermeture de l'onglet : on reprend là où l'on était,
    sans redemander le mot de passe. Pas de chargement automatique tant qu'il
    n'y a pas de session — la page ne dépense rien avant d'être utilisée.
  */
  sb.auth.getSession().then(function (r) {
    if (r.data.session) {
      afficherLeBord(true);
      charger();
    }
  });
})();
</script>
</body>
</html>
